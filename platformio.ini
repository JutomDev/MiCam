[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; Konfiguracja pamięci: ESP32-S3R8 (8MB Flash, 8MB Octal PSRAM)
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    esp32-camera
    lovyan03/LovyanGFX @ ^1.1.12
    bodmer/TJpg_Decoder @ ^1.1.0

[env:test_display]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

build_src_filter =
    -<*>
    +<../src_test/test_display.cpp>

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.12
